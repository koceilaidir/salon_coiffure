name: salon_coiffure
description: Logiciel de gestion du salon de coiffure (application Windows de la gérante).
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.3.0
  printing: ^5.13.0
  pdf: ^3.11.0
  file_picker: ^8.1.2
  url_launcher: ^6.3.0
  # Envoi direct à l'imprimante (ouverture du tiroir-caisse)
  win32: ^5.5.0
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
